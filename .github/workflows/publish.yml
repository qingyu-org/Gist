name: Publish QingyuGist Release

run-name: Publish QingyuGist v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

# Two dispatches racing each other would both pass the tag check in `prepare`
# and then fight over the same tag and GHCR tags, so releases queue instead.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE: ghcr.io/qingyu-org/qingyugist
  VERSION_PACKAGE: github.com/qingyu-org/Gist/internal/config.QingyuGistVersion

jobs:
  # Validate the version before spending time on builds, so a typo fails in
  # seconds and never leaves a half-published tag behind.
  prepare:
    name: Check v${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      docker_tags: ${{ steps.release.outputs.docker_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version and collect commits
        id: release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

          previous_tag=$(git tag -l 'v*' --sort=-version:refname | sed -n '1p')
          if [[ -n "$previous_tag" ]]; then
            git log "${previous_tag}..HEAD" --pretty=format:"- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" > release-notes.md
          else
            git log --pretty=format:"- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo '- Maintenance release' > release-notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo 'docker_tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:nightly"
            if [[ "$VERSION" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Keep the release notes for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # A release ships whatever the branch holds, and the archives cannot be
  # corrected once they are downloaded. The same gates CI runs on every push
  # therefore run here too, so a red linter or a type error stops the release
  # before a tag exists.
  verify:
    name: Verify
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=20m --disable=errcheck

      - name: Format
        run: make fmt check_changes

      - name: Vet
        run: go vet ./...

      - name: Check translations
        run: make check-tr

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # Binaries and the container image only share the source tree, so they run
  # in parallel instead of making the release wait for both in sequence.
  binaries:
    name: Binaries
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npx vite -c public/vite.config.js build

      - name: Build release binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            'linux amd64' \
            'linux arm64' \
            'windows amd64' \
            'darwin amd64' \
            'darwin arm64'; do
            read -r goos goarch <<< "$target"
            archive="qingyugist-${VERSION}-${goos}-${goarch}"
            binary='qingyugist'
            [[ "$goos" == 'windows' ]] && binary='qingyugist.exe'
            mkdir -p "build/${archive}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -tags fs_embed -trimpath \
              -ldflags "-s -w -X ${VERSION_PACKAGE}=v${VERSION}" \
              -o "build/${archive}/${binary}" .
            tar -C "build/${archive}" -czf "dist/${archive}.tar.gz" .
            rm -rf "build/${archive}"
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      # The version reaches the binary through -ldflags; a typo there would
      # otherwise only show up after the tag is already published.
      - name: Check the injected version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -C smoke -xzf "dist/qingyugist-${VERSION}-linux-amd64.tar.gz"
          reported=$(./smoke/qingyugist version)
          echo "$reported"
          if [[ "$reported" != *"v${VERSION}"* ]]; then
            echo "Binary reports the wrong version" >&2
            exit 1
          fi

      - name: Keep the archives for the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  image:
    name: Image
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ needs.prepare.outputs.docker_tags }}

  # Tag and release last: a failed build leaves no tag to clean up, and a rerun
  # of a successful build does not collide with one pushed before it existed.
  publish:
    name: Tag and release
    needs: [prepare, binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch the archives
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "QingyuGist v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
